<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="t d">
  <title id="t">agent-md-caregiver logo</title>
  <desc id="d">A friendly nurse with a red-cross cap holding a Markdown file wearing a bandage and a thermometer.</desc>
  <rect width="320" height="320" rx="48" fill="#EAF6F4"/>

  <!-- Markdown file (patient) -->
  <g transform="rotate(-6 200 190)">
    <path d="M142 92h92l38 38v132a10 10 0 0 1-10 10H142a10 10 0 0 1-10-10V102a10 10 0 0 1 10-10z" fill="#FFFFFF" stroke="#2B3A4A" stroke-width="5" stroke-linejoin="round"/>
    <path d="M234 92v28a10 10 0 0 0 10 10h28" fill="#DDE7EE" stroke="#2B3A4A" stroke-width="5" stroke-linejoin="round"/>
    <!-- "MD" mark -->
    <text x="202" y="214" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="44" font-weight="700" fill="#2B3A4A">MD</text>
    <!-- sleepy-but-recovering face -->
    <circle cx="180" cy="160" r="4" fill="#2B3A4A"/>
    <circle cx="224" cy="160" r="4" fill="#2B3A4A"/>
    <path d="M190 172q12 9 24 0" fill="none" stroke="#2B3A4A" stroke-width="4" stroke-linecap="round"/>
    <!-- bandage -->
    <g transform="rotate(-25 245 248)">
      <rect x="215" y="238" width="60" height="22" rx="11" fill="#F2C9A0" stroke="#2B3A4A" stroke-width="4"/>
      <circle cx="238" cy="249" r="1.8" fill="#2B3A4A"/><circle cx="245" cy="249" r="1.8" fill="#2B3A4A"/><circle cx="252" cy="249" r="1.8" fill="#2B3A4A"/>
    </g>
  </g>

  <!-- Nurse -->
  <!-- body -->
  <path d="M30 316c0-52 30-86 66-86s66 34 66 86z" fill="#4FB3A6" stroke="#2B3A4A" stroke-width="5" stroke-linejoin="round"/>
  <path d="M82 232l14 22 14-22" fill="#FFFFFF" stroke="#2B3A4A" stroke-width="4" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="96" cy="170" r="42" fill="#F6D2B4" stroke="#2B3A4A" stroke-width="5"/>
  <!-- cap -->
  <path d="M52 150c2-30 24-42 44-42s42 12 44 42z" fill="#FFFFFF" stroke="#2B3A4A" stroke-width="5" stroke-linejoin="round"/>
  <rect x="88" y="119" width="16" height="5" rx="2" fill="#E5484D"/>
  <rect x="93.5" y="113.5" width="5" height="16" rx="2" fill="#E5484D"/>
  <!-- face -->
  <circle cx="82" cy="172" r="4" fill="#2B3A4A"/>
  <circle cx="110" cy="172" r="4" fill="#2B3A4A"/>
  <path d="M84 187q12 10 24 0" fill="none" stroke="#2B3A4A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="70" cy="184" r="5" fill="#F4A7A0" opacity=".7"/>
  <circle cx="122" cy="184" r="5" fill="#F4A7A0" opacity=".7"/>
  <!-- arm holding thermometer toward the file -->
  <path d="M138 262q22-6 40-22" fill="none" stroke="#2B3A4A" stroke-width="5" stroke-linecap="round"/>
  <g transform="rotate(-35 176 236)">
    <rect x="160" y="230" width="42" height="9" rx="4.5" fill="#FFFFFF" stroke="#2B3A4A" stroke-width="3.5"/>
    <circle cx="160" cy="234.5" r="6" fill="#E5484D" stroke="#2B3A4A" stroke-width="3.5"/>
  </g>
</svg>
